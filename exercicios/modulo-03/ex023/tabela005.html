<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3rem;
            font-weight: bolder;
            padding: 8px;
        }

        td, th {
            border: 1px solid gray;
            padding: 8px;
        }

        .destaque {
            background-color: #888888;
            color: #fafafa;
        }

        .cnome {
            background-color: lightgreen;
        }

        .cgrupo {
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="3">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Hiago Gabriel</td>
            <td>Masculino</td>
            <td>21 anos</td>
            <td>Militar</td>
        </tr>
        <tr>
            <td>Kauã Micael</td>
            <td>Masculino</td>
            <td>20 anos</td>
            <td>CLT</td>
        </tr>
        <tr class="destaque">
            <td>Fernanda Hoff</td>
            <td>Feminino</td>
            <td>21 anos</td>
            <td>Nail Designer</td>
        </tr>
        <tr>
            <td>Daiane Borba</td>
            <td>Feminino</td>
            <td>40 anos</td>
            <td>Diarista</td>
        </tr>
    </table>
</body>
</html>
