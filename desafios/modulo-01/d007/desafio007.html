<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexível</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>
        Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência🤯.
    </p>
    <picture>
        <source srcset="img/paisagem-p.png" media="(max-width: 600px)">
        <source srcset="img/paisagem-m.png" media="(max-width: 1000px)">
        <img src="img/paisagem-g.png" alt="imagem principal">
    </picture>
    
</body>
</html>
