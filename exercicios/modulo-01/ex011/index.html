<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminiua o tamanho do seu navegador.
    </p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png" >
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios no html5.</p>
    <audio src="midia/01 - Algo Novo (Ao Vivo).mp3" controls autoplay></audio>
    <!--Outra maneira de reproduzir áudio-->
    <audio controls>
        <source src="midia/01 - Algo Novo (Ao Vivo).mp3" type="audio/mp3">
        <source src="midia/01 - Algo Novo (Ao Vivo).ogg" type="audio/ogg"> 
        <source src="midia/01 - Algo Novo (Ao Vivo).wav" type="audio/wav">
    </audio>
    <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/01 - Algo Novo (Ao Vivo).mp3" >Clique aqui para baixar o arquivo MP3</a>
    </p>
    


</body>
</html>
